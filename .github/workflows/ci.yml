name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # macOS 러너: 장치 화면 렌더링 테스트가 macOS 시스템 글꼴(sans-serif) 폭을 기준으로
    # 잘림을 검사한다. ubuntu 에서는 글꼴이 달라 6개가 실패한다 — 앱도 macOS 전용이다
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: 의존성 설치
        # npm ci: package-lock.json 과 어긋나면 실패한다 (락파일 검증 겸용)
        run: npm ci
      - name: Pillow 설치
        # 게임·장면 워커(src/*-worker.py)가 Pillow 를 쓴다. 없으면 장면 테스트 4개가 실패한다
        run: python -m pip install Pillow
      - name: 테스트
        run: npm test

  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Swift 테스트
        run: npm run test:native
