name: 기능·개선
description: 새 기능 또는 기존 동작 개선
labels: [enhancement]
body:
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 왜 필요한가, 지금은 무엇이 문제인가
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 작업이 끝나면 무엇이 달라지는가 (1-3문장)
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 건드릴 화면·모듈·데이터를 항목으로. 하지 않을 것도 적으면 좋다
      placeholder: |
        - <화면/모듈>: ...
        - <저장·검증>: ...
        - 하지 않는 것: ...
    validations:
      required: true
  - type: textarea
    id: done-criteria
    attributes:
      label: 완료 조건
      description: 체크리스트로 쓴다 — 끝낼 때마다 체크한다. 체크 안 된 항목이 남으면 CI `issue-criteria` 가 merge 를 막는다. 하지 못한 항목은 `- [ ] ~~항목~~ 이유(→ #후속)` 로 정리한다
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 구현 메모
      description: 미리 알아낸 제약·함정 (기존 저장분 호환, 계층 규칙, 성능 등)
  - type: textarea
    id: verification
    attributes:
      label: 검증
      description: 무엇을 돌려야 완료로 볼 수 있는가. CI 밖 게이트가 있으면 여기에도 적는다
      placeholder: |
        - `npm run check`
        - (해당 시) 로컬 전용 게이트: 실제 StreamDock 장치 확인 (docs/device-validation.md)
        - 회귀 테스트: ...
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: 관련 문서·이슈
      description: 설계 문서는 커밋 SHA 고정 blob 링크로 (브랜치 URL은 머지 후 죽는다)
      placeholder: "docs/specs/YYYY-MM-DD-<slug>-design.md, #N"
