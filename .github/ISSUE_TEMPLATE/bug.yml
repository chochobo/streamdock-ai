name: 버그
description: 잘못 동작하는 것
labels: [bug]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 현상
      description: 어떤 화면·조건에서 무엇이 잘못 보이거나 잘못 저장되는가
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현·실측
      description: 재현 절차. 수치로 잴 수 있으면 실측값을 붙인다 (뷰포트 폭, 요소 크기, 응답 값 등)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: 원인
      description: 짚었으면 근인과 해당 코드 위치 (`src/server.mjs:123`). 모르면 비워 둔다
  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 누가/무엇이 영향을 받나, 저장된 데이터에 영향이 있나, 우회 방법이 있나
